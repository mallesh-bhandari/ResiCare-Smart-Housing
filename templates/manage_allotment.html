<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Allotment | ResiCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #f39c12; /* Allotment Theme: Orange */
            --blue-dark: #1e3c72;
            --text-main: #333;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            /* Blue Gradient to match Manage Flats */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Professional Card Style */
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border-top: 5px solid var(--accent);
            overflow: hidden;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #f8f9fa;
            color: #777;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            padding: 18px 20px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f1f1;
            font-size: 15px;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fff9f0; /* Soft orange hover */
            transition: 0.3s;
        }

        /* Elements Styling */
        .flat-badge {
            font-weight: 700;
            color: var(--blue-dark);
            background: #e8f0fe;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #d1e3ff;
            display: inline-block;
        }

        .res-name {
            font-weight: 600;
            color: #222;
            display: block;
            font-size: 16px;
        }

        .contact-text {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
        }

        .date-text {
            color: #555;
            font-size: 14px;
        }

        /* FIXED BUTTON LINK */
        .btn-view {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            border: 1.5px solid #3c8dbc;
            color: #3c8dbc;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            background: transparent;
        }

        .btn-view:hover {
            background: #3c8dbc;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(60, 141, 188, 0.2);
        }

        .status-pill {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title"><i class="fa fa-id-card-clip"></i> Registered Allotments</h3>
            <span class="status-pill">Active Residents: {{ allotments|length }}</span>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Flat Info</th>
                    <th>Resident Details</th>
                    <th>Allotment Date</th>
                    <th style="text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in allotments %}
                <tr>
                    <td>
                        <span class="flat-badge">{{ item.flat_no }}</span>
                    </td>
                    <td>
                        <span class="res-name">{{ item.resident_name }}</span>
                        <div class="contact-text">
                            <i class="fa fa-phone" style="font-size: 11px;"></i> {{ item.contact_no }}
                        </div>
                    </td>
                    <td>
                        <span class="date-text">
                            <i class="fa fa-calendar-check" style="color: #bbb; margin-right: 5px;"></i> 
                            {{ item.allotment_date }}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        <a href="/view_resident/{{ item.id }}" class="btn-view">
                            <i class="fa fa-eye"></i> VIEW PROFILE
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
