<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Login | ResiCare</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Aapke screenshot wala green gradient theme */
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }

        .login-card {
            background: white; 
            padding: 45px 35px; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 100%;
            max-width: 400px; 
            text-align: center;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .login-card h2 { 
            color: #27ae60; 
            margin-bottom: 8px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-card p { 
            color: #777; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }

        .input-group { 
            margin-bottom: 20px; 
            position: relative; 
            text-align: left;
        }

        .input-group i { 
            position: absolute; 
            left: 15px; 
            top: 50%;
            transform: translateY(-50%);
            color: #aaa; 
            transition: 0.3s;
        }

        input {
            width: 100%; 
            padding: 14px 15px 14px 45px; 
            border: 2px solid #eee;
            border-radius: 10px; 
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #27ae60;
            background-color: #f9fffb;
        }

        input:focus + i {
            color: #27ae60;
        }

        .btn-login {
            width: 100%; 
            padding: 14px; 
            background: #27ae60; 
            color: white;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #219150;
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4);
            transform: translateY(-2px);
        }

        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #27ae60;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #666;
        }

        .back-home i {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2><i class="fa fa-home"></i> Resident Login</h2>
    <p>Enter details to access your dashboard</p>
    
    <form action="/resident_login" method="POST">
        <div class="input-group">
            <i class="fa fa-building"></i>
            <input type="text" name="flat_no" placeholder="Flat Number (e.g. A-101)" required>
        </div>

        <div class="input-group">
            <i class="fa fa-phone"></i>
            <input type="password" name="mobile_no" placeholder="Registered Mobile Number" required>
        </div>

        <button type="submit" class="btn-login">LOGIN AS RESIDENT</button>
    </form>

    <div class="register-link">
        New Resident? <a href="/register">Register Here</a>
    </div>

    <a href="/" class="back-home"><i class="fa fa-arrow-left"></i> Back to Home</a>
</div>

</body>
</html>
