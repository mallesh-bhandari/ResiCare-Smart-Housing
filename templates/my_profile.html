<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ResiCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 50px auto; }
        .profile-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #27ae60; }
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-header i { font-size: 60px; color: #27ae60; }
        .profile-header h2 { margin: 10px 0 5px; color: #333; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: #27ae60; outline: none; box-shadow: 0 0 5px rgba(39,174,96,0.2); }
        input[readonly] { background: #f9f9f9; color: #888; cursor: not-allowed; border-style: dashed; }
        
        .btn-update { background: #27ae60; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-update:hover { background: #1e8449; transform: translateY(-2px); }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #27ae60; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .back-link:hover { color: #1e8449; }
    </style>
</head>
<body>

<div class="container">
    <a href="/resident_dashboard" class="back-link"><i class="fa fa-arrow-left"></i> Back to Dashboard</a>
    
    <div class="profile-card">
        <div class="profile-header">
            <i class="fa fa-user-circle"></i>
            <h2>My Profile</h2>
            <p style="color: #888;">Update your personal information</p>
        </div>

        <form method="POST" action="/my_profile">
            <div class="form-group">
                <label><i class="fa fa-building"></i> Flat Number (Fixed)</label>
                <input type="text" value="{{ user.flat_no }}" readonly>
            </div>

            <div class="form-group">
                <label><i class="fa fa-user"></i> Full Name</label>
                <input type="text" name="resident_name" value="{{ user.resident_name }}" required>
            </div>

            <div class="form-group">
                <label><i class="fa fa-phone"></i> Contact / Password</label>
                <input type="text" name="contact_no" value="{{ user.contact_no }}" required placeholder="10-digit mobile number">
                <small style="color: #999; font-size: 11px;">Note: This number is also used for login.</small>
            </div>

            <button type="submit" class="btn-update">Save Changes</button>
        </form>
    </div>
</div>

</body>
</html>
